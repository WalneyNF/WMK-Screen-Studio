name: WMK - Compilar Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/test_audience_api.py'
      - 'tools/audience_api.py'
      - '.github/workflows/wmk-windows-build.yml'

concurrency:
  group: wmk-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # setup-node tries to run pnpm for automatic caching BEFORE it is installed.
          package-manager-cache: false
      - name: Preparar Corepack e pnpm
        shell: pwsh
        run: |
          if (-not (Get-Command corepack -ErrorAction SilentlyContinue)) {
            npm install --global corepack@0.34.5
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verificar API Audience Intelligence
        run: python -m unittest discover -s tests -p test_audience_api.py -v
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test
      - run: corepack pnpm fetch:ffmpeg --target x86_64-pc-windows-msvc
      - run: corepack pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config .github/tauri.unsigned.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: WMK-Screen-Studio-Windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
